<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kompendium metodyka</title>
<style>
  :root { --bg: #f6f4ee; --paper: #ffffff; --fg: #1f2433; --slate: #5b6275; --border: #dcd8cc;
    --cobalt: #3d64b0; --gold: #c9a24a; --red: #b3372e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181f; --paper: #1e222c; --fg: #e8e6e0; --slate: #a3a9b8;
    --border: #353a47; --cobalt: #8fb0ef; --gold: #d9b964; --red: #ef8a80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px; }
  main { width: 100%; max-width: 420px; background: var(--paper); border: 1px solid var(--border); border-top: 4px solid var(--gold);
    border-radius: 10px; padding: 28px 26px; }
  .et { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); margin: 0 0 6px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; line-height: 1.2; color: var(--cobalt); margin: 0 0 10px; }
  p { margin: 0 0 18px; color: var(--slate); font-size: 15px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }
  .rzad { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 14px; color: var(--slate); }
  .rzad label { display: inline; font-weight: 400; margin: 0; }
  button { width: 100%; font: inherit; font-weight: 600; font-size: 16px; padding: 11px; border-radius: 8px; border: 0;
    background: var(--cobalt); color: var(--paper); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .blad { color: var(--red); font-size: 14px; min-height: 1.5em; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <div class="et">Prestige Lingua · Metodyka</div>
  <h1>Kompendium metodyka</h1>
  <p>Strona dla zespołu metodycznego. Hasło znajdziesz w Bitrixie.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="kompendium-metodyka" autocomplete="username" hidden>
    <label for="haslo">Hasło</label>
    <input type="password" id="haslo" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <div class="rzad"><input type="checkbox" id="pamietaj"><label for="pamietaj">Zapamiętaj na tym urządzeniu</label></div>
    <button type="submit" id="otworz">Otwórz kompendium</button>
    <div class="blad" id="blad" role="alert"></div>
  </form>
</main>

<script>
(function () {
  var ITER = 600000, KLUCZ = "kompendium-metodyka-haslo";
  var f = document.getElementById("f"), pole = document.getElementById("haslo"), blad = document.getElementById("blad"),
      btn = document.getElementById("otworz"), pam = document.getElementById("pamietaj");

  function norm(h) { return h.trim().toLowerCase().replace(/\s+/g, "-"); }

  async function odszyfruj(haslo) {
    var raw = Uint8Array.from(atob(document.getElementById("dane").textContent.trim()), function (c) { return c.charCodeAt(0); });
    var sol = raw.slice(8, 16), szyfr = raw.slice(16);
    var baza = await crypto.subtle.importKey("raw", new TextEncoder().encode(haslo), "PBKDF2", false, ["deriveBits"]);
    var bity = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sol, iterations: ITER, hash: "SHA-256" }, baza, 384));
    var klucz = await crypto.subtle.importKey("raw", bity.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    var tekst = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: bity.slice(32, 48) }, klucz, szyfr));
    if (!/^<!doctype html>/i.test(tekst)) throw new Error("złe hasło");
    return tekst;
  }

  function pokaz(tekst) {
    var przewin = '<script>(function(){var id=decodeURIComponent(location.hash.slice(1));var e=id&&document.getElementById(id);if(e)setTimeout(function(){e.scrollIntoView();},60);})();<\/script>';
    var i = tekst.lastIndexOf("</body>");
    if (i >= 0) tekst = tekst.slice(0, i) + przewin + tekst.slice(i);
    document.open(); document.write(tekst); document.close();
  }

  async function sprobuj(haslo, zapamietaj) {
    btn.disabled = true; btn.textContent = "Otwieram…"; blad.textContent = "";
    try {
      var tekst = await odszyfruj(haslo);
      try { if (zapamietaj) localStorage.setItem(KLUCZ, haslo); else localStorage.removeItem(KLUCZ); } catch (e) {}
      pokaz(tekst);
    } catch (e) {
      try { localStorage.removeItem(KLUCZ); } catch (e2) {}
      btn.disabled = false; btn.textContent = "Otwórz kompendium";
      blad.textContent = (window.crypto && crypto.subtle) ? "To nie jest właściwe hasło. Spróbuj jeszcze raz." :
        "Ta przeglądarka nie potrafi otworzyć strony. Otwórz link w Chrome, Safari albo Edge.";
      pole.select();
    }
  }

  f.addEventListener("submit", function (e) { e.preventDefault(); var h = norm(pole.value); if (h) sprobuj(h, pam.checked); });

  var zapisane = null;
  try { zapisane = localStorage.getItem(KLUCZ); } catch (e) {}
  if (zapisane) { pam.checked = true; sprobuj(zapisane, true); } else { pole.focus(); }
})();
</script>
